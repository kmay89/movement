<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Movement — share card source</title>
<!--
  Source for og-image.png, the card iMessage/Slack/WhatsApp show when someone
  shares a Movement link. Rendered to PNG at exactly 1200x630 by
  scripts/make_og.js — edit here, re-run that, commit the PNG.

  Drawn in the app's own visual language: a dawn sky, ripples on water, and
  an ensō left deliberately open.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: #fdf6ee;
    position: relative;
    background:
      radial-gradient(90% 120% at 78% 18%, rgba(255, 200, 140, 0.5), transparent 62%),
      linear-gradient(150deg, #3b2456 0%, #a04a63 56%, #f0964f 122%);
  }

  canvas { position: absolute; inset: 0; }

  .inner {
    position: relative;
    z-index: 2;
    height: 100%;
    padding: 68px 76px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 700px;
  }

  .mark {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: radial-gradient(circle at 62% 38%, #ffe9c4, rgba(255, 233, 196, 0.16) 62%, transparent 74%);
    box-shadow: 0 0 60px rgba(255, 217, 176, 0.65);
    margin-bottom: 26px;
  }

  h1 {
    font-size: 92px;
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 0.98;
    text-shadow: 0 4px 40px rgba(40, 15, 45, 0.4);
  }

  .tag {
    font-size: 33px;
    font-weight: 500;
    line-height: 1.28;
    margin-top: 20px;
    opacity: 0.95;
    letter-spacing: -0.01em;
  }

  .points {
    display: flex;
    gap: 10px;
    margin-top: 40px;
  }

  .chip {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.005em;
    padding: 11px 16px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.16);
    border: 1.5px solid rgba(255, 255, 255, 0.24);
    white-space: nowrap;
  }
</style>
</head>
<body>
  <canvas id="art" width="1200" height="630"></canvas>
  <div class="inner">
    <div class="mark"></div>
    <h1>Movement</h1>
    <p class="tag">Make moving feel like living,<br>not like work.</p>
    <div class="points">
      <span class="chip">🔬 Every claim cited</span>
      <span class="chip">🫂 No leaderboards</span>
      <span class="chip">🔒 Stays on your phone</span>
    </div>
  </div>

<script>
// Ripples and an ensō, drawn to match js/visuals.js. Deterministic — no
// randomness — so regenerating the card gives a byte-identical image.
const c = document.getElementById('art');
const ctx = c.getContext('2d');
const INK = '255, 226, 190';

// Water rings, weighted toward the open right side of the card.
const rings = [
  [905, 250, 120], [905, 250, 178], [905, 250, 246], [905, 250, 330], [905, 250, 430],
  [1040, 470, 96], [1040, 470, 150], [1040, 470, 214],
  [250, 560, 130], [250, 560, 196], [250, 560, 272],
];
for (const [x, y, r] of rings) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(${INK}, ${Math.max(0.05, 0.34 - r / 1500)})`;
  ctx.lineWidth = 2.2;
  ctx.stroke();
}

// The ensō — one brush stroke, weighted, never quite closed.
const CX = 905, CY = 288, R = 196;
const START = -Math.PI / 2 + 0.22;
const SWEEP = Math.PI * 2 - 0.5;
const STEPS = 150;
for (let i = 0; i < STEPS; i++) {
  const a0 = START + SWEEP * (i / STEPS);
  const a1 = START + SWEEP * ((i + 1) / STEPS) + 0.006;
  const p = i / STEPS;
  const weight = 0.5 + 0.5 * Math.sin(Math.PI * Math.pow(p, 0.8)) + 0.06 * Math.sin(p * 22);
  ctx.beginPath();
  ctx.arc(CX, CY, R, a0, a1);
  ctx.strokeStyle = `rgba(${INK}, 0.9)`;
  ctx.lineWidth = 15 * weight;
  ctx.lineCap = 'round';
  ctx.stroke();
}
</script>
</body>
</html>
